buildscript {
    ext.kotlin_version = '1.7.20'
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }

    dependencies {
        classpath libs.gradle
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.example.privacy_policy_lib'
    compileSdk 34

    defaultConfig {
        minSdk 27

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation('com.squareup.retrofit2:converter-simplexml:2.9.0') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'stax', module: 'stax'
        exclude group: 'xpp3', module: 'xpp3'
    }
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.webkit
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.retrofit
    implementation libs.logging.interceptor
    implementation libs.rxjava2.rxjava
    implementation libs.rxjava2.rxandroid
}

afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                groupId "com.logo.androidlibs"
                artifactId "privacy-policy-lib"
                version "46.0"
                from components.release
                pom {
                    description = 'privacy-policy-lib'
                }
            }
        }

        def props = new Properties()
        props.load(new FileInputStream(rootProject.file("local.properties")))
        def nexusUsername = props.getProperty("nexusUsername") ? new String(Base64.decoder.decode(props.getProperty("nexusUsername"))) : ""
        def nexusPassword = props.getProperty("nexusPassword") ? new String(Base64.decoder.decode(props.getProperty("nexusPassword"))) : ""

        repositories {
            maven {
                name = "nexus"
                url = uri("https://sonarnexus.logo.com.tr:8443/repository/android-packages")
                credentials {
                    username = nexusUsername
                    password = nexusPassword
                }
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}